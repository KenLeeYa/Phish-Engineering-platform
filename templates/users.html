{{define "body"}}
<div class="col-sm-9 col-sm-offset-3 col-md-10 col-md-offset-2 main">
    <div class="row">
        <h1 class="page-header">
            {{.Title}}
        </h1>
    </div>
    <div id="flashes" class="row">
        {{template "flashes" .Flashes}}
    </div>
    <div class="row">
        <button type="button" class="btn btn-primary" id="new_button" data-toggle="modal" data-backdrop="static"
            data-user-id="-1" data-target="#modal">
            <i class="fa fa-plus"></i> {{t "user.new"}}</button>
    </div>
    &nbsp;
    <div id="loading">
        <i class="fa fa-spinner fa-spin fa-4x"></i>
    </div>
    <div class="row">
        <table id="userTable" class="table" style="display:none;">
            <thead>
                <tr>
                    <th>{{t "auth.username"}}</th>
                    <th>{{t "user.role"}}</th>
                    <th>{{t "user.last_login"}}</th>
                    <th class="col-md-2 no-sort"></th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>
</div>
<!-- Modal -->
<div class="modal fade" id="modal" tabindex="-1" role="dialog" aria-labelledby="modalLabel">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
                <h4 class="modal-title" id="userModalLabel">{{t "user.new"}}</h4>
            </div>
            <div class="modal-body" id="modal_body">
                <div class="row" id="modal.flashes"></div>
                <label class="control-label" for="username">{{t "auth.username"}}:</label>
                <div class="form-group">
                    <input type="text" class="form-control" placeholder="{{t "auth.username"}}" id="username" autofocus />
                </div>
                <label class="control-label" for="password">{{t "common.password"}}:</label>
                <div class="form-group">
                    <input type="password" class="form-control" autocomplete="new-password" placeholder="{{t "common.password"}}" id="password" required />
                    <div class="hidden" id="password-strength-container">
                        <div class="progress" id="password-strength">
                            <div id="password-strength-bar" class="progress-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                        </div>
                        <span id="password-strength-description"></span>
                    </div>
                </div>
                <label class="control-label" for="confirm_password">{{t "user.confirm_password"}}</label>
                <div class="form-group">
                    <input type="password" class="form-control" placeholder="{{t "user.confirm_password"}}" id="confirm_password"
                        required />
                </div>
                <div class="checkbox checkbox-primary">
                    <input id="force_password_change_checkbox" type="checkbox" checked>
                    <label for="force_password_change_checkbox">{{t "user.require_password_change"}}</label>
                </div>
                <div class="checkbox checkbox-primary">
                    <input id="account_locked_checkbox" type="checkbox">
                    <label for="account_locked_checkbox">{{t "user.account_locked"}}</label>
                </div>
                <label class="control-label" for="role">{{t "user.role"}}</label>
                <div class="form-group" id="role-select">
                    <select class="form-control" placeholder="" id="role" />
                    <option value="system_admin">{{t "role.system_admin"}}</option>
                    <option value="security_manager">{{t "role.security_manager"}}</option>
                    <option value="campaign_creator">{{t "role.campaign_creator"}}</option>
                    <option value="approver">{{t "role.approver"}}</option>
                    <option value="reporter">{{t "role.reporter"}}</option>
                    <option value="department_manager">{{t "role.department_manager"}}</option>
                    <option value="auditor">{{t "role.auditor"}}</option>
                    <option value="user">{{t "role.user"}}</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-default" data-dismiss="modal">{{t "action.close"}}</button>
                <button type="button" class="btn btn-primary" id="modalSubmit">{{t "action.save_changes"}}</button>
            </div>
        </div>
    </div>
</div>
{{end}} {{define "scripts"}}
<script src="/js/dist/app/passwords.min.js"></script>
<script src="/js/dist/app/users.min.js"></script>
{{end}}
